name: Docker Build Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: docker build -t streamlit-app:latest .

    - name: Test image presence
      run: docker images | grep streamlit-app

    # Optional: Verify if the entrypoint is correct
    - name: Inspect Entrypoint
      run: docker inspect streamlit-app:latest | grep windows.py
